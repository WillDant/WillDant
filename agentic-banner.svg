<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090F"/>
      <stop offset="0.5" stop-color="#111124"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#A78BFA" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="path1" d="M70 245 C180 180, 260 205, 350 155 C430 110, 520 130, 620 90" />
    <path id="path2" d="M100 100 C220 150, 320 80, 460 105 C590 130, 720 55, 860 80" />
    <path id="path3" d="M240 270 C380 230, 520 270, 650 215 C790 155, 930 180, 1100 120" />

    <style>
      .dash {
        stroke-dasharray: 10 12;
        animation: dashMove 16s linear infinite;
      }

      .floatA {
        animation: floatA 6s ease-in-out infinite;
        transform-origin: center;
      }

      .floatB {
        animation: floatB 8s ease-in-out infinite;
        transform-origin: center;
      }

      .pulseText {
        animation: pulseText 3.2s ease-in-out infinite;
      }

      .flicker {
        animation: flicker 2.8s linear infinite;
      }

      .scan {
        animation: scan 5s ease-in-out infinite;
      }

      @keyframes dashMove {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -600; }
      }

      @keyframes floatA {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes floatB {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      @keyframes pulseText {
        0%,100% { opacity: 0.95; }
        50% { opacity: 1; }
      }

      @keyframes flicker {
        0%,100% { opacity: 1; }
        10% { opacity: 0.95; }
        20% { opacity: 1; }
        30% { opacity: 0.92; }
        40% { opacity: 1; }
        50% { opacity: 0.97; }
        60% { opacity: 1; }
        70% { opacity: 0.93; }
        80% { opacity: 1; }
        90% { opacity: 0.98; }
      }

      @keyframes scan {
        0% { opacity: 0.15; transform: translateX(-80px); }
        50% { opacity: 0.35; }
        100% { opacity: 0.15; transform: translateX(1140px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <circle cx="190" cy="80" r="120" fill="#7C3AED" opacity="0.18" filter="url(#bigGlow)"/>
  <circle cx="1000" cy="240" r="140" fill="#22D3EE" opacity="0.12" filter="url(#bigGlow)"/>
  <circle cx="610" cy="160" r="170" fill="#A78BFA" opacity="0.08" filter="url(#bigGlow)"/>

  <!-- Moving scan light -->
  <rect class="scan" x="-80" y="0" width="80" height="320" fill="url(#textGrad)" opacity="0.08" />

  <!-- Network lines -->
  <g opacity="0.75">
    <path d="M70 245 C180 180, 260 205, 350 155 C430 110, 520 130, 620 90" stroke="url(#glowLine)" stroke-width="2.2" stroke-linecap="round" class="dash"/>
    <path d="M100 100 C220 150, 320 80, 460 105 C590 130, 720 55, 860 80" stroke="url(#glowLine)" stroke-width="2.2" stroke-linecap="round" class="dash"/>
    <path d="M240 270 C380 230, 520 270, 650 215 C790 155, 930 180, 1100 120" stroke="url(#glowLine)" stroke-width="2.2" stroke-linecap="round" class="dash"/>
  </g>

  <!-- Data packets -->
  <circle r="4" fill="#E9D5FF" filter="url(#softGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#path1"/>
    </animateMotion>
  </circle>

  <circle r="4" fill="#67E8F9" filter="url(#softGlow)">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#path2"/>
    </animateMotion>
  </circle>

  <circle r="4" fill="#C4B5FD" filter="url(#softGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#path3"/>
    </animateMotion>
  </circle>

  <!-- Nodes -->
  <g class="floatA">
    <circle cx="110" cy="215" r="6" fill="#A78BFA"/>
    <circle cx="110" cy="215" r="10" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2">
      <animate attributeName="r" values="10;18;10" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="floatB">
    <circle cx="320" cy="175" r="6" fill="#67E8F9"/>
    <circle cx="320" cy="175" r="10" stroke="#67E8F9" stroke-opacity="0.55" stroke-width="2">
      <animate attributeName="r" values="10;18;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="floatA">
    <circle cx="485" cy="105" r="6" fill="#C4B5FD"/>
    <circle cx="485" cy="105" r="10" stroke="#C4B5FD" stroke-opacity="0.55" stroke-width="2">
      <animate attributeName="r" values="10;18;10" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="floatB">
    <circle cx="670" cy="208" r="6" fill="#A78BFA"/>
    <circle cx="670" cy="208" r="10" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2">
      <animate attributeName="r" values="10;18;10" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="floatA">
    <circle cx="905" cy="165" r="6" fill="#67E8F9"/>
    <circle cx="905" cy="165" r="10" stroke="#67E8F9" stroke-opacity="0.55" stroke-width="2">
      <animate attributeName="r" values="10;18;10" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left icon block -->
  <g transform="translate(90 84)" class="flicker">
    <rect x="0" y="0" width="180" height="150" rx="28" fill="#0E1324" stroke="#A78BFA" stroke-opacity="0.28"/>
    <rect x="16" y="16" width="148" height="118" rx="20" fill="#0B1020" stroke="#67E8F9" stroke-opacity="0.16"/>

    <path d="M93 28 L58 84 H92 L76 122 L122 64 H90 L106 28 Z"
          fill="url(#textGrad)"
          filter="url(#softGlow)"/>

    <circle cx="32" cy="32" r="3" fill="#67E8F9"/>
    <circle cx="148" cy="32" r="3" fill="#A78BFA"/>
    <circle cx="32" cy="118" r="3" fill="#A78BFA"/>
    <circle cx="148" cy="118" r="3" fill="#67E8F9"/>

    <path d="M20 75 H48" stroke="#67E8F9" stroke-opacity="0.4"/>
    <path d="M132 75 H160" stroke="#A78BFA" stroke-opacity="0.4"/>
  </g>

  <!-- Main Text -->
  <g class="pulseText">
    <text x="330" y="120"
          fill="url(#textGrad)"
          font-family="Segoe UI, Inter, Arial, sans-serif"
          font-size="44"
          font-weight="700"
          letter-spacing="1.5"
          filter="url(#softGlow)">
      WILLIAN DANTAS
    </text>

    <text x="332" y="164"
          fill="#E9D5FF"
          font-family="Segoe UI, Inter, Arial, sans-serif"
          font-size="24"
          font-weight="600">
      Agentic Engineer ⚡
    </text>

    <text x="332" y="198"
          fill="#A5B4FC"
          font-family="Segoe UI, Inter, Arial, sans-serif"
          font-size="17"
          font-weight="500">
      Building AI systems that don't just answer — they act.
    </text>

    <text x="332" y="226"
          fill="#94A3B8"
          font-family="Segoe UI, Inter, Arial, sans-serif"
          font-size="15">
      Conversational AI • Automation • Integrations
    </text>
  </g>

  <!-- Underline -->
  <path d="M332 245 H860" stroke="url(#glowLine)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Bottom pills -->
  <g transform="translate(332 262)">
    <rect x="0" y="0" rx="14" ry="14" width="104" height="28" fill="#111827" stroke="#A78BFA" stroke-opacity="0.26"/>
    <text x="52" y="18" text-anchor="middle" fill="#DDD6FE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">AI AGENTS</text>

    <rect x="116" y="0" rx="14" ry="14" width="82" height="28" fill="#111827" stroke="#67E8F9" stroke-opacity="0.26"/>
    <text x="157" y="18" text-anchor="middle" fill="#CFFAFE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">n8n</text>

    <rect x="210" y="0" rx="14" ry="14" width="98" height="28" fill="#111827" stroke="#A78BFA" stroke-opacity="0.26"/>
    <text x="259" y="18" text-anchor="middle" fill="#DDD6FE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">APIs</text>

    <rect x="320" y="0" rx="14" ry="14" width="126" height="28" fill="#111827" stroke="#67E8F9" stroke-opacity="0.26"/>
    <text x="383" y="18" text-anchor="middle" fill="#CFFAFE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">AUTOMATION</text>
  </g>
</svg>
